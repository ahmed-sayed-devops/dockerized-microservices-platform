http:

  routers:

    dashboard:

      rule: Host(`traefik.local`)

      entryPoints:
        - websecure

      service: api@internal

      tls: {}

      middlewares:
        - admin-chain

    dashboard-http:

      rule: Host(`traefik.local`)

      entryPoints:
        - web

      service: api@internal

      middlewares:
        - https-redirect

  middlewares:

    https-redirect:

      redirectScheme:

        scheme: https

        permanent: true
