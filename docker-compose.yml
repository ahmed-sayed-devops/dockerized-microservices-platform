services:

  mysql:
    image: mysql:8.4

    ports:
      - "3306:3306"

    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend-net
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0

    command:
    - --config.my-cnf=/cfg/.my.cnf

    volumes:
    - ./monitoring/mysql/.my.cnf:/cfg/.my.cnf:ro

    depends_on:
     mysql:
       condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9104/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    expose:
    - "9104"

    networks:
    - backend-net
    - monitoring-net
  backend1:
    build:
      context: ./backend

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend-net

  backend2:
    build:
      context: ./backend

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend-net
  frontend:
    build:
      context: ./frontend

    networks:
      - frontend-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    ports:
      - "80:80"

    depends_on:
      - frontend
      - backend1
      - backend2

    networks:
      - frontend-net
      - backend-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest

    ports:
      - "8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    privileged: true

    devices:
      - /dev/kmsg

    command:
      - --docker_only=false
      - --housekeeping_interval=10s

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - cadvisor

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - monitoring-net
      - backend-net

  grafana:
    image: grafana/grafana-oss:latest

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - monitoring-net
 
volumes:
  db-data:
  grafana-data:

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge

  monitoring-net:
    driver: bridge