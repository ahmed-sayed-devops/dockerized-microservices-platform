services:

  mysql:
    env_file:
      - .env.development

  backend:
    build:
      target: development

    env_file:
      - .env.development

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    command: npm run dev

  frontend:
    build:
      target: development

    env_file:
      - .env.development

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: npm run dev -- --host
