services:

  mysql-primary:
    env_file:
      - .env.production

    restart: unless-stopped

    mem_limit: 512m
    cpus: 0.60

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mysql-replica:
    restart: unless-stopped

    mem_limit: 512m
    cpus: 0.60

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"  

  mysql-replication-init:
    env_file:
      - .env.production

    restart: "no"

    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"    


  mysql-router:
    restart: unless-stopped

    mem_limit: 64m
    cpus: 0.20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3" 



  mysql-auto-failover:
    restart: always

    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"    

  mysql-auto-rejoin:
    restart: always  

    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"                 

  mysqld-exporter-primary:
    env_file:
      - .env.production  
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"  


  mysqld-exporter-replica:
    env_file:
      - .env.production  
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    env_file:
      - .env.production  
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"   


  redis-exporter:
    env_file:
      - .env.production  
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"        



  backend1:
    build:
      target: production

    env_file:
      - .env.production

    restart: unless-stopped

    environment:
      NODE_ENV: production
      INSTANCE_NAME: backend1

    mem_limit: 384m
    cpus: 0.40

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend2:
    build:
      target: production

    env_file:
      - .env.production

    restart: unless-stopped

    environment:
      NODE_ENV: production
      INSTANCE_NAME: backend2

    mem_limit: 384m
    cpus: 0.40

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  frontend:
    build:
      target: production

    env_file:
      - .env.production

    restart: unless-stopped

    mem_limit: 192m
    cpus: 0.20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

