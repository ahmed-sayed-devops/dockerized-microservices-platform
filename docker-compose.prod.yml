    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"                


  auth-service:
    build:
      target: production

    env_file:
      - .env.production

    restart: unless-stopped

    mem_limit: 128m
    cpus: 0.10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"      
        

  mysql-backup:
    env_file:
      - .env.production

    restart: always

    mem_limit: 128m
    cpus: 0.20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"        
